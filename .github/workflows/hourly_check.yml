name: Hourly Heli Check

on:
  schedule:
    # This runs every hour at the 00 minute mark
    - cron: '0 * * * *'
  workflow_dispatch: # Allows you to test it manually

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install requests

      - name: Run Checker
        run: python check_status.py
